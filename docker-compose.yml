version: '3.8'

services:
  ris-server:
    build: .
    image: ris-server:test
    container_name: ris-server
    ports:
      - "5000:5000"
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
      - ./RIS_BusData:/app/RIS_BusData
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    privileged: true
    cap_add:
      - SYS_ADMIN
      - SYS_RAWIO
      - SYS_TTY_CONFIG
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - COM_PORT=/dev/ttyUSB0
      - SERIAL_PORT=/dev/ttyUSB0
      - TZ=Asia/Taipei
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "5000"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - ris-network

networks:
  ris-network:
    driver: bridge 