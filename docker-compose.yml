version: '3.8'

services:
  ris-server:
    image: ris-server:test
    container_name: ris-server
    ports:
      - "5000:5000"  # 簡化端口映射
    env_file:
      - .env
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    devices:
      - /dev/ttyS3:/dev/ttyS3  # COM4 in Linux
    cap_add:
      - SYS_ADMIN  # 添加系統權限以訪問串口
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "5000"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - ris-network

networks:
  ris-network:
    driver: bridge 