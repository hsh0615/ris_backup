version: '3.8'

services:
  ris-server:
    image: ris-server:test
    container_name: ris-server
    ports:
      - "0.0.0.0:5000:5000"  # 明確指定監聽所有接口
    env_file:
      - .env
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
      - /dev/ttyS3:/dev/ttyS3  # COM4 in Linux
    devices:
      - /dev/ttyS3:/dev/ttyS3  # COM4 in Linux
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "5000"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - ris-network

networks:
  ris-network:
    driver: bridge 