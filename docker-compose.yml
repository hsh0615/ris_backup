version: '3.8'

services:
  ris-server:
    image: ris-server:test
    ports:
      - "${SERVER_PORT:-5000}:5000"
    env_file:
      - .env
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/ttyS0:/dev/ttyS0  # 映射 COM1
      - /dev/ttyS1:/dev/ttyS1  # 映射 COM2
      - /dev/ttyS2:/dev/ttyS2  # 映射 COM3
      - /dev/ttyS3:/dev/ttyS3  # 映射 COM4
      - /dev/ttyUSB0:/dev/ttyUSB0  # 映射 USB 串口
      - /dev/ttyUSB1:/dev/ttyUSB1
      - /dev/ttyUSB2:/dev/ttyUSB2
      - /dev/ttyUSB3:/dev/ttyUSB3
    networks:
      - ris-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  ris-network:
    driver: bridge 