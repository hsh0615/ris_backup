version: '3.8'

services:
  ris_server:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - USBIP_HOST=host.docker.internal
      - USBIP_PORT=3240
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    # Add necessary capabilities and devices
    cap_add:
      - SYS_MODULE
      - SYS_ADMIN
    devices:
      - /dev/bus/usb:/dev/bus/usb
    # Use bridge network instead of host network
    networks:
      - ris_network
    # Add restart policy
    restart: unless-stopped
    # Add healthcheck
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  ris_network:
    driver: bridge 